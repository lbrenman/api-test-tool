name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: npm test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: npm test

  newman:
    name: newman (${{ matrix.auth }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        auth: [none, apikey, basic, bearer, jwt, oauth2, hmac]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Start server (sqlite + local files)
        env:
          PORT: '3000'
          AUTH_MODE: ${{ matrix.auth }}
          DB_DRIVER: sqlite
          FILE_STORE: local
          SEED_ON_START: always
          PUBLIC_BASE_URL: http://127.0.0.1:3000
          LOG_LEVEL: warn
        run: |
          nohup node src/server.js > server.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:3000/ready && break; sleep 1; done
      - name: Run Postman collection with Newman
        run: |
          npx newman run postman/API-Test-Tool.postman_collection.json \
            -e postman/API-Test-Tool.postman_environment.json \
            --env-var baseUrl=http://127.0.0.1:3000 \
            --env-var authMode=${{ matrix.auth }} \
            --working-dir postman \
            --reporters cli,junit --reporter-junit-export newman-results/${{ matrix.auth }}.xml
      - name: Server log
        if: failure()
        run: cat server.log
      - name: Report Newman failures as annotations
        if: failure()
        run: |
          node -e '
            const fs = require("fs");
            for (const f of fs.existsSync("newman-results") ? fs.readdirSync("newman-results") : []) {
              const x = fs.readFileSync("newman-results/" + f, "utf8");
              for (const m of x.matchAll(/<testcase name="([^"]*)"[^>]*classname="([^"]*)"[^>]*>([\s\S]*?)<\/testcase>/g)) {
                const fail = /<failure[^>]*message="([^"]*)"/.exec(m[3]);
                if (fail) console.log(`::error title=${m[2]}::${m[1]} - ${fail[1]}`.slice(0, 1000));
              }
            }
            const log = fs.existsSync("server.log") ? fs.readFileSync("server.log", "utf8").split("\n").slice(-15).join(" | ") : "";
            if (log) console.log(`::warning title=server.log tail::${log.slice(0, 1500)}`);
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: newman-${{ matrix.auth }}
          path: newman-results/

  storage:
    name: npm test (postgres + s3)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DB_DRIVER: postgres
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      TEST_FILE_STORE: s3
      S3_BUCKET: att-test
      S3_REGION: us-east-1
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Start an S3-compatible server (MinIO, SeaweedFS fallback)
        run: |
          set -x
          docker run -d --name s3 -p 9000:9000 -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z server /data \
          || docker run -d --name s3 -p 9000:9000 -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:RELEASE.2025-04-22T22-12-26Z server /data \
          || { printf '{"identities":[{"name":"admin","credentials":[{"accessKey":"minioadmin","secretKey":"minioadmin"}],"actions":["Admin","Read","List","Tagging","Write"]}]}' > /tmp/s3.json; \
               docker run -d --name s3 -p 9000:8333 -v /tmp/s3.json:/etc/s3.json chrislusf/seaweedfs server -s3 -s3.config=/etc/s3.json; }
          for i in $(seq 1 60); do curl -s -o /dev/null http://127.0.0.1:9000/ && break; sleep 1; done
          sleep 3
          for i in $(seq 1 10); do AWS_ACCESS_KEY_ID=minioadmin AWS_SECRET_ACCESS_KEY=minioadmin aws --endpoint-url http://127.0.0.1:9000 --region us-east-1 s3 mb s3://att-test && break; sleep 3; done
      - name: Install dependencies
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: npm test
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee test-output.txt
          status=${PIPESTATUS[0]}
          if [ "$status" != "0" ]; then
            # Surface failures as annotations (readable without downloading logs)
            grep -n -A 14 "^not ok\|^    not ok" test-output.txt | head -c 20000 | python3 -c "import sys; print('::error title=failing tests::' + sys.stdin.read().replace('%','%25').replace('\r','').replace('\n','%0A'))"
          fi
          exit $status

  docker:
    name: docker build + smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg GIT_SHA=${{ github.sha }} -t api-test-tool .
      - name: Run container and smoke test
        run: |
          docker run -d --name att -p 3000:3000 -v att-data:/data -e ADMIN_PASSWORD=ci-secret api-test-tool
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:3000/ready && break; sleep 1; done
          curl -fsS http://127.0.0.1:3000/health | grep '"status":"ok"'
          curl -fsS http://127.0.0.1:3000/health | grep '"commit":"${{ github.sha }}"'
          curl -fsS "http://127.0.0.1:3000/v1/p/cursor/employees?limit=2" | grep nextCursor
          curl -fsS -o /dev/null -r 0-99 -w '%{http_code}' http://127.0.0.1:3000/v1/files/sample-large-bin/download | grep 206
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/admin/api/overview)" = "401"
          docker restart att && sleep 5
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3000/ready && break; sleep 1; done
          curl -fsS http://127.0.0.1:3000/health | grep '"employees":250'

  # Deploys master to the API Lab EC2 stack once every other job is green. Builds natively on arm64,
  # smoke-tests the image, pushes it to ECR and rolls it out over SSM. Skips until the repo variable
  # API_LAB_DEPLOY_ROLE_ARN is set, and never runs on PRs, forks or other branches.
  deploy:
    name: deploy to API Lab
    needs: [unit, newman, storage, docker]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master' &&
      vars.API_LAB_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-24.04-arm
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: deploy-api-lab
      cancel-in-progress: false
    env:
      AWS_REGION: ${{ vars.API_LAB_REGION || 'us-east-2' }}
      STACK: ${{ vars.API_LAB_STACK || 'api-lab' }}
      SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Skip if master has moved on
        id: head
        run: |
          # Tests for an older commit can finish after a newer one's; never let an older build overwrite :latest.
          # The newer commit deploys itself once its own tests pass.
          head=$(git ls-remote origin refs/heads/master | cut -f1)
          if [ "$head" != "$SHA" ]; then
            echo "master is now $head; skipping deploy of $SHA" >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and smoke-test the arm64 image
        if: steps.head.outputs.skip != 'true'
        run: |
          docker build --build-arg GIT_SHA="$SHA" -t att:candidate .
          docker run -d --name att -p 3000:3000 -e ADMIN_PASSWORD=ci-secret att:candidate
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:3000/ready && break; sleep 1; done
          curl -fsS http://127.0.0.1:3000/health | grep '"status":"ok"'
          curl -fsS http://127.0.0.1:3000/health | grep "\"commit\":\"$SHA\""
          docker rm -f att

      - uses: aws-actions/configure-aws-credentials@v4
        if: steps.head.outputs.skip != 'true'
        with:
          role-to-assume: ${{ vars.API_LAB_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        if: steps.head.outputs.skip != 'true'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push image
        if: steps.head.outputs.skip != 'true'
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          img="$REGISTRY/$STACK/api-test-tool"
          docker tag att:candidate "$img:$SHA"
          docker tag att:candidate "$img:latest"
          docker push --all-tags "$img"
          echo "Pushed $img:$SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Roll out if API Lab is running
        id: rollout
        if: steps.head.outputs.skip != 'true'
        run: |
          id=$(aws ec2 describe-instances --filters "Name=tag:Name,Values=$STACK" "Name=instance-state-name,Values=running" \
            --query 'Reservations[].Instances[].InstanceId' --output text)
          if [ -z "$id" ]; then
            echo "API Lab is stopped; it will run this build on its next start." >> "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          cmd=$(aws ssm send-command --instance-ids "$id" --document-name "$STACK-deploy" \
            --comment "deploy $SHA" --query Command.CommandId --output text)
          for _ in $(seq 1 60); do
            s=$(aws ssm get-command-invocation --command-id "$cmd" --instance-id "$id" --query Status --output text 2>/dev/null || echo Pending)
            case "$s" in
              Success) echo "Deployed $SHA to API Lab" >> "$GITHUB_STEP_SUMMARY"; echo "rolled=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation --command-id "$cmd" --instance-id "$id" \
                  --query '[StandardOutputContent,StandardErrorContent]' --output text; exit 1 ;;
            esac
            sleep 5
          done
          echo "::error::deploy still running after 5 minutes"; exit 1

      - name: Check API Lab reports this commit
        if: steps.rollout.outputs.rolled == 'true' && vars.API_LAB_URL != ''
        env:
          URL: ${{ vars.API_LAB_URL }}
        run: |
          for _ in $(seq 1 24); do
            got=$(curl -fsS "${URL%/}/health" 2>/dev/null | sed -nE 's/.*"commit":"([0-9a-f]+)".*/\1/p')
            if [ "$got" = "$SHA" ]; then echo "API Lab /health reports $SHA" >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
            sleep 5
          done
          echo "::error::API Lab /health reports commit '${got:-none}', expected $SHA"; exit 1
