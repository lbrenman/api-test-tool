name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: npm test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: npm test

  newman:
    name: newman (${{ matrix.auth }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        auth: [none, apikey, basic, bearer, jwt, oauth2, hmac]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Start server (sqlite + local files)
        env:
          PORT: '3000'
          AUTH_MODE: ${{ matrix.auth }}
          DB_DRIVER: sqlite
          FILE_STORE: local
          SEED_ON_START: always
          PUBLIC_BASE_URL: http://127.0.0.1:3000
          LOG_LEVEL: warn
        run: |
          nohup node src/server.js > server.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:3000/ready && break; sleep 1; done
      - name: Run Postman collection with Newman
        run: |
          npx newman run postman/API-Test-Tool.postman_collection.json \
            -e postman/API-Test-Tool.postman_environment.json \
            --env-var baseUrl=http://127.0.0.1:3000 \
            --env-var authMode=${{ matrix.auth }} \
            --working-dir postman \
            --reporters cli,junit --reporter-junit-export newman-results/${{ matrix.auth }}.xml
      - name: Server log
        if: failure()
        run: cat server.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: newman-${{ matrix.auth }}
          path: newman-results/

  storage:
    name: npm test (postgres + s3)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DB_DRIVER: postgres
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      TEST_FILE_STORE: s3
      S3_BUCKET: att-test
      S3_REGION: us-east-1
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin minio/minio server /data
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:9000/minio/health/live && break; sleep 1; done
          AWS_ACCESS_KEY_ID=minioadmin AWS_SECRET_ACCESS_KEY=minioadmin aws --endpoint-url http://127.0.0.1:9000 --region us-east-1 s3 mb s3://att-test
      - name: Install dependencies
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: npm test
        shell: bash
        run: |
          npm test 2>&1 | tee test-output.txt
          status=${PIPESTATUS[0]}
          if [ "$status" != "0" ]; then
            # Surface failures as annotations (readable without downloading logs)
            grep -n -A 14 "^not ok\|^    not ok" test-output.txt | head -c 20000 | python3 -c "import sys; print('::error title=failing tests::' + sys.stdin.read().replace('%','%25').replace('\r','').replace('\n','%0A'))"
          fi
          exit $status
