openapi: 3.1.0
jsonSchemaDialect: https://spec.openapis.org/oas/3.1/dialect/base
info:
  title: Supplier Order Collaboration API
  version: 1.0.0-draft
  summary: Governed collaboration for purchase orders and supplier shipments
  description: |
    Illustrative API for a supplier collaboration demonstration. It enables approved internal
    applications and supplier partners to discover purchase orders, acknowledge or reject
    them, create advance shipment notices, and track shipment status.

    This draft is intentionally business-oriented and is not a representation of an
    existing production interface. Resource names, identifiers, security patterns,
    ownership, classifications, and support contacts should be validated with the API owner before
    implementation.
  contact:
    name: API Center for Enablement
    url: https://example.invalid/acme/api-support
    email: api-enablement@example.invalid
  license:
    name: Internal and Authorized Partner Use
    identifier: LicenseRef-Internal-Authorized-Use
  x-acme-ownership:
    businessOwner: Global Supply Chain Operations
    productOwner: Enterprise Integration and API Enablement
    technicalOwner: Supplier Collaboration Platform Team
    dataSteward: Procurement Data Governance
  x-acme-audience:
    primary:
      - internal-application
      - supplier-partner
    secondary:
      - operations-support
    excluded:
      - public-anonymous
  x-acme-classification:
    businessCriticality: high
    dataClassification: confidential
    pii: limited-business-contact-data
    regulatedData: none-intended
    availabilityTier: tier-2
  x-acme-support:
    serviceDeskCatalogItem: API - Supplier Order Collaboration
    supportModel: follow-the-sun
    supportEmail: supplier-api-support@example.invalid
    documentationUrl: https://example.invalid/acme/apis/supplier-order-collaboration
    statusPageUrl: https://status.example.invalid/acme/supplier-order-collaboration
    escalationPolicy: API Platform L1 -> Supplier Platform L2 -> Product Engineering L3
  x-acme-lifecycle:
    status: proposed
    targetConsumers:
      - Supplier portals
      - Supplier integration applications
      - Internal procurement applications
    deprecationNoticeDays: 180
  x-acme-consumption-metadata:
    registrationFields:
      - consumerOrganization
      - projectName
      - costCenter
      - businessPurpose
      - technicalContact
    meteringEnabled: true
    chargebackReady: true
externalDocs:
  description: Business onboarding and support guide
  url: https://example.invalid/acme/apis/supplier-order-collaboration/guide
servers:
  - url: https://api.sandbox.example.invalid/supplier-collaboration/v1
    description: Illustrative sandbox endpoint
  - url: https://api.example.invalid/supplier-collaboration/v1
    description: Illustrative production endpoint
security:
  - ApiKeyAuth: []
  - OAuth2ClientCredentials:
      - supplier-orders.read
      - supplier-orders.write

tags:
  - name: Purchase Orders
    description: Purchase orders made available to approved consumers.
    x-acme-audience:
      - internal-application
      - supplier-partner
    x-acme-classification: confidential
  - name: Acknowledgements
    description: Supplier responses to purchase orders.
    x-acme-audience:
      - supplier-partner
    x-acme-classification: confidential
  - name: Shipments
    description: Advance shipment notices and shipment status.
    x-acme-audience:
      - internal-application
      - supplier-partner
    x-acme-classification: confidential

paths:
  /purchase-orders:
    get:
      tags: [Purchase Orders]
      operationId: listPurchaseOrders
      summary: List purchase orders available to the consumer
      description: |
        Returns purchase orders the authenticated consumer is authorized to view. The
        provider must filter records by supplier, consumer application, and approved scope.
      x-acme-business-capability: Supplier order visibility
      x-acme-owner: Global Supply Chain Operations
      x-acme-audience: [internal-application, supplier-partner]
      x-acme-classification: confidential
      x-acme-support-tier: business-hours-plus-on-call
      parameters:
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - name: supplierId
          in: query
          description: Filters orders by enterprise supplier identifier.
          schema:
            $ref: '#/components/schemas/SupplierId'
        - name: status
          in: query
          description: |
            Filters orders by lifecycle status. Accepts a single status or a comma-separated
            list of statuses (no spaces). Allowed values: OPEN, PARTIALLY_ACKNOWLEDGED,
            ACKNOWLEDGED, IN_FULFILLMENT, CLOSED, CANCELLED.
          schema:
            type: string
            pattern: '^(OPEN|PARTIALLY_ACKNOWLEDGED|ACKNOWLEDGED|IN_FULFILLMENT|CLOSED|CANCELLED)(,(OPEN|PARTIALLY_ACKNOWLEDGED|ACKNOWLEDGED|IN_FULFILLMENT|CLOSED|CANCELLED))*$'
          example: OPEN,PARTIALLY_ACKNOWLEDGED
        - name: updatedSince
          in: query
          description: Returns orders updated at or after this timestamp.
          schema:
            type: string
            format: date-time
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageToken'
      responses:
        '200':
          description: Purchase orders returned successfully.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrderPage'
              examples:
                openOrders:
                  summary: Open orders for an approved supplier
                  value:
                    items:
                      - purchaseOrderId: PO-4500123456
                        supplierId: SUP-100245
                        buyingOrganization: Acme-US
                        orderDate: '2026-09-15'
                        currency: USD
                        status: OPEN
                        requestedDeliveryDate: '2026-10-05'
                        shipTo:
                          siteCode: US-AUBURN-HILLS
                          name: Acme Manufacturing Site
                          countryCode: US
                        lines:
                          - lineNumber: 10
                            materialId: MAT-778210
                            description: Industrial controller assembly
                            orderedQuantity: 250
                            acknowledgedQuantity: 0
                            unitOfMeasure: EA
                            unitPrice: 84.50
                        lastUpdatedAt: '2026-09-23T14:22:31Z'
                    nextPageToken: null
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalServerError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  /purchase-orders/{purchaseOrderId}:
    parameters:
      - $ref: '#/components/parameters/PurchaseOrderIdPath'
    get:
      tags: [Purchase Orders]
      operationId: getPurchaseOrder
      summary: Get a purchase order
      description: Returns a purchase order and its lines when the consumer is authorized for the owning supplier or business unit.
      x-acme-business-capability: Supplier order visibility
      x-acme-owner: Global Supply Chain Operations
      x-acme-audience: [internal-application, supplier-partner]
      x-acme-classification: confidential
      parameters:
        - $ref: '#/components/parameters/CorrelationIdHeader'
      responses:
        '200':
          description: Purchase order returned successfully.
          headers:
            ETag:
              description: Entity tag for optimistic concurrency.
              schema: {type: string}
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PurchaseOrder'}
              examples:
                standardOrder:
                  $ref: '#/components/examples/PurchaseOrderExample'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalServerError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  /purchase-orders/{purchaseOrderId}/acknowledgements:
    parameters:
      - $ref: '#/components/parameters/PurchaseOrderIdPath'
    post:
      tags: [Acknowledgements]
      operationId: acknowledgePurchaseOrder
      summary: Accept, partially accept, or reject a purchase order
      description: |
        Records the supplier response to the current purchase-order revision. An idempotency
        key is required to prevent duplicate acknowledgements when clients retry.
      x-acme-business-capability: Supplier order acknowledgement
      x-acme-owner: Global Supply Chain Operations
      x-acme-audience: [supplier-partner]
      x-acme-classification: confidential
      x-acme-approval-required: false
      parameters:
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PurchaseOrderAcknowledgementRequest'}
            examples:
              acceptWithDateChange:
                summary: Accept with a revised delivery date
                value:
                  acknowledgementType: ACCEPT_WITH_CHANGES
                  supplierReference: SUP-ACK-88419
                  comment: Confirmed with revised delivery date.
                  lines:
                    - lineNumber: 10
                      acknowledgedQuantity: 250
                      confirmedDeliveryDate: '2026-10-08'
      responses:
        '201':
          description: Acknowledgement recorded.
          headers:
            Location:
              description: URL of the created acknowledgement.
              schema: {type: string, format: uri}
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PurchaseOrderAcknowledgement'}
              examples:
                recorded:
                  value:
                    acknowledgementId: ACK-20260923-000184
                    purchaseOrderId: PO-4500123456
                    acknowledgementType: ACCEPT_WITH_CHANGES
                    supplierReference: SUP-ACK-88419
                    status: RECORDED
                    recordedAt: '2026-09-23T16:45:10Z'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalServerError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  /shipments:
    post:
      tags: [Shipments]
      operationId: createAdvanceShipmentNotice
      summary: Create an advance shipment notice
      description: Creates a shipment notice against one or more authorized purchase-order lines.
      x-acme-business-capability: Inbound shipment visibility
      x-acme-owner: Global Logistics Operations
      x-acme-audience: [supplier-partner]
      x-acme-classification: confidential
      x-acme-event-published: shipment.notice.created
      parameters:
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateShipmentRequest'}
            examples:
              supplierAsn:
                $ref: '#/components/examples/CreateShipmentExample'
      responses:
        '201':
          description: Advance shipment notice created.
          headers:
            Location:
              description: URL of the created shipment.
              schema: {type: string, format: uri}
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Shipment'}
              examples:
                createdShipment:
                  $ref: '#/components/examples/ShipmentExample'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalServerError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    get:
      tags: [Shipments]
      operationId: listShipments
      summary: List shipments
      description: Returns shipments authorized for the supplier or internal consumer.
      x-acme-business-capability: Inbound shipment visibility
      x-acme-owner: Global Logistics Operations
      x-acme-audience: [internal-application, supplier-partner]
      x-acme-classification: confidential
      parameters:
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - name: purchaseOrderId
          in: query
          schema: {$ref: '#/components/schemas/PurchaseOrderId'}
        - name: supplierId
          in: query
          schema: {$ref: '#/components/schemas/SupplierId'}
        - name: status
          in: query
          description: |
            Filters shipments by status. Accepts a single status or a comma-separated
            list of statuses (no spaces). Allowed values: DRAFT, SUBMITTED, IN_TRANSIT,
            DELIVERED, DELAYED, CANCELLED.
          schema:
            type: string
            pattern: '^(DRAFT|SUBMITTED|IN_TRANSIT|DELIVERED|DELAYED|CANCELLED)(,(DRAFT|SUBMITTED|IN_TRANSIT|DELIVERED|DELAYED|CANCELLED))*$'
          example: IN_TRANSIT,DELAYED
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageToken'
      responses:
        '200':
          description: Shipments returned successfully.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ShipmentPage'}
              examples:
                inTransit:
                  value:
                    items:
                      - shipmentId: SHP-20260923-00192
                        supplierId: SUP-100245
                        shipmentNoticeNumber: ASN-440882
                        status: IN_TRANSIT
                        carrierCode: UPS
                        trackingNumber: 1Z999AA10123456784
                        expectedArrivalAt: '2026-10-07T15:00:00Z'
                        purchaseOrders: [PO-4500123456]
                        createdAt: '2026-09-23T16:55:00Z'
                        lastUpdatedAt: '2026-10-03T10:14:00Z'
                    nextPageToken: null
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalServerError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  /shipments/{shipmentId}:
    parameters:
      - $ref: '#/components/parameters/ShipmentIdPath'
    get:
      tags: [Shipments]
      operationId: getShipment
      summary: Get shipment status and details
      x-acme-business-capability: Inbound shipment visibility
      x-acme-owner: Global Logistics Operations
      x-acme-audience: [internal-application, supplier-partner]
      x-acme-classification: confidential
      parameters:
        - $ref: '#/components/parameters/CorrelationIdHeader'
      responses:
        '200':
          description: Shipment returned successfully.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Shipment'}
              examples:
                inTransitShipment:
                  $ref: '#/components/examples/ShipmentExample'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalServerError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Current-state compatible API-key option for approved clients.
    OAuth2ClientCredentials:
      type: oauth2
      description: Target OAuth 2.0 client-credentials pattern to validate with the enterprise identity architecture.
      flows:
        clientCredentials:
          tokenUrl: https://identity.example.invalid/oauth2/token
          scopes:
            supplier-orders.read: Read purchase orders and shipment status.
            supplier-orders.write: Submit acknowledgements and shipment notices.

  parameters:
    CorrelationIdHeader:
      name: X-Correlation-Id
      in: header
      required: false
      description: Consumer-provided identifier used for end-to-end traceability. The service generates one when omitted.
      schema:
        type: string
        minLength: 8
        maxLength: 128
      example: 5f754b61-2038-4978-a7cb-6d6a97afd501
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      description: Unique key used to safely retry a state-changing request.
      schema:
        type: string
        minLength: 8
        maxLength: 128
      example: supplier-100245-asn-440882
    PurchaseOrderIdPath:
      name: purchaseOrderId
      in: path
      required: true
      description: Enterprise purchase-order identifier.
      schema: {$ref: '#/components/schemas/PurchaseOrderId'}
      example: PO-4500123456
    ShipmentIdPath:
      name: shipmentId
      in: path
      required: true
      description: Shipment identifier.
      schema:
        type: string
        pattern: '^SHP-[0-9]{8}-[0-9]{5}$'
      example: SHP-20260923-00192
    PageSize:
      name: pageSize
      in: query
      description: Maximum number of records to return.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    PageToken:
      name: pageToken
      in: query
      description: Opaque token from the previous page.
      schema:
        type: string
        maxLength: 512

  headers:
    CorrelationId:
      description: Correlation identifier used for tracing and support.
      schema: {type: string}

  schemas:
    PurchaseOrderId:
      type: string
      pattern: '^PO-[0-9]{10}$'
      examples: [PO-4500123456]
    SupplierId:
      type: string
      pattern: '^SUP-[0-9]{6}$'
      examples: [SUP-100245]
    PurchaseOrderStatus:
      type: string
      enum: [OPEN, PARTIALLY_ACKNOWLEDGED, ACKNOWLEDGED, IN_FULFILLMENT, CLOSED, CANCELLED]
    ShipmentStatus:
      type: string
      enum: [DRAFT, SUBMITTED, IN_TRANSIT, DELIVERED, DELAYED, CANCELLED]
    Address:
      type: object
      additionalProperties: false
      required: [siteCode, name, countryCode]
      properties:
        siteCode: {type: string, maxLength: 40}
        name: {type: string, maxLength: 120}
        addressLine1: {type: string, maxLength: 120}
        city: {type: string, maxLength: 80}
        region: {type: string, maxLength: 80}
        postalCode: {type: string, maxLength: 20}
        countryCode: {type: string, pattern: '^[A-Z]{2}$'}
    PurchaseOrderLine:
      type: object
      additionalProperties: false
      required: [lineNumber, materialId, description, orderedQuantity, unitOfMeasure]
      properties:
        lineNumber: {type: integer, minimum: 1}
        materialId: {type: string, maxLength: 60}
        description: {type: string, maxLength: 240}
        orderedQuantity: {type: number, exclusiveMinimum: 0}
        acknowledgedQuantity: {type: number, minimum: 0, default: 0}
        unitOfMeasure: {type: string, maxLength: 12}
        unitPrice: {type: number, minimum: 0}
    PurchaseOrder:
      type: object
      additionalProperties: false
      required:
        - purchaseOrderId
        - supplierId
        - buyingOrganization
        - orderDate
        - currency
        - status
        - requestedDeliveryDate
        - shipTo
        - lines
        - lastUpdatedAt
      properties:
        purchaseOrderId: {$ref: '#/components/schemas/PurchaseOrderId'}
        supplierId: {$ref: '#/components/schemas/SupplierId'}
        buyingOrganization: {type: string, maxLength: 80}
        orderDate: {type: string, format: date}
        currency: {type: string, pattern: '^[A-Z]{3}$'}
        status: {$ref: '#/components/schemas/PurchaseOrderStatus'}
        requestedDeliveryDate: {type: string, format: date}
        shipTo: {$ref: '#/components/schemas/Address'}
        lines:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/PurchaseOrderLine'}
        lastUpdatedAt: {type: string, format: date-time}
    PurchaseOrderPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/PurchaseOrder'}
        nextPageToken:
          type: [string, 'null']
    AcknowledgementType:
      type: string
      enum: [ACCEPT, ACCEPT_WITH_CHANGES, REJECT]
    AcknowledgementLineRequest:
      type: object
      additionalProperties: false
      required: [lineNumber, acknowledgedQuantity]
      properties:
        lineNumber: {type: integer, minimum: 1}
        acknowledgedQuantity: {type: number, minimum: 0}
        confirmedDeliveryDate: {type: string, format: date}
        rejectionReasonCode: {type: [string, 'null'], maxLength: 60}
    PurchaseOrderAcknowledgementRequest:
      type: object
      additionalProperties: false
      required: [acknowledgementType, lines]
      properties:
        acknowledgementType: {$ref: '#/components/schemas/AcknowledgementType'}
        supplierReference: {type: string, maxLength: 80}
        comment: {type: string, maxLength: 1000}
        lines:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/AcknowledgementLineRequest'}
    PurchaseOrderAcknowledgement:
      type: object
      additionalProperties: false
      required: [acknowledgementId, purchaseOrderId, acknowledgementType, status, recordedAt]
      properties:
        acknowledgementId: {type: string}
        purchaseOrderId: {$ref: '#/components/schemas/PurchaseOrderId'}
        acknowledgementType: {$ref: '#/components/schemas/AcknowledgementType'}
        supplierReference: {type: string}
        status: {type: string, enum: [RECORDED, PENDING_REVIEW, REJECTED]}
        recordedAt: {type: string, format: date-time}
    ShipmentLine:
      type: object
      additionalProperties: false
      required: [purchaseOrderId, lineNumber, shippedQuantity, unitOfMeasure]
      properties:
        purchaseOrderId: {$ref: '#/components/schemas/PurchaseOrderId'}
        lineNumber: {type: integer, minimum: 1}
        shippedQuantity: {type: number, exclusiveMinimum: 0}
        unitOfMeasure: {type: string, maxLength: 12}
        lotNumber: {type: string, maxLength: 80}
    Package:
      type: object
      additionalProperties: false
      required: [packageId, packageType]
      properties:
        packageId: {type: string, maxLength: 80}
        packageType: {type: string, enum: [PALLET, CARTON, CRATE, OTHER]}
        grossWeight: {type: number, minimum: 0}
        weightUnit: {type: string, enum: [KG, LB]}
    CreateShipmentRequest:
      type: object
      additionalProperties: false
      required:
        - supplierId
        - shipmentNoticeNumber
        - carrierCode
        - shipFrom
        - shipTo
        - plannedShipAt
        - expectedArrivalAt
        - lines
      properties:
        supplierId: {$ref: '#/components/schemas/SupplierId'}
        shipmentNoticeNumber: {type: string, maxLength: 80}
        carrierCode: {type: string, maxLength: 40}
        trackingNumber: {type: string, maxLength: 100}
        shipFrom: {$ref: '#/components/schemas/Address'}
        shipTo: {$ref: '#/components/schemas/Address'}
        plannedShipAt: {type: string, format: date-time}
        expectedArrivalAt: {type: string, format: date-time}
        lines:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/ShipmentLine'}
        packages:
          type: array
          items: {$ref: '#/components/schemas/Package'}
    Shipment:
      allOf:
        - $ref: '#/components/schemas/CreateShipmentRequest'
        - type: object
          required: [shipmentId, status, purchaseOrders, createdAt, lastUpdatedAt]
          properties:
            shipmentId: {type: string, pattern: '^SHP-[0-9]{8}-[0-9]{5}$'}
            status: {$ref: '#/components/schemas/ShipmentStatus'}
            purchaseOrders:
              type: array
              minItems: 1
              uniqueItems: true
              items: {$ref: '#/components/schemas/PurchaseOrderId'}
            createdAt: {type: string, format: date-time}
            lastUpdatedAt: {type: string, format: date-time}
    ShipmentPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Shipment'}
        nextPageToken:
          type: [string, 'null']
    ProblemDetails:
      type: object
      additionalProperties: true
      required: [type, title, status, detail, instance, correlationId, timestamp]
      properties:
        type:
          type: string
          format: uri-reference
          description: URI identifying the problem type.
        title: {type: string, maxLength: 120}
        status: {type: integer, minimum: 400, maximum: 599}
        detail: {type: string, maxLength: 2000}
        instance:
          type: string
          format: uri-reference
        correlationId: {type: string, maxLength: 128}
        timestamp: {type: string, format: date-time}
        errorCode: {type: string, maxLength: 80}
        violations:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field: {type: string}
              message: {type: string}

  responses:
    BadRequest:
      description: The request is malformed or contains invalid parameters.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ProblemDetails'}
          example:
            type: https://example.invalid/problems/invalid-request
            title: Invalid request
            status: 400
            detail: The updatedSince value is not a valid date-time.
            instance: /supplier-collaboration/v1/purchase-orders
            correlationId: 5f754b61-2038-4978-a7cb-6d6a97afd501
            timestamp: '2026-09-23T16:50:00Z'
