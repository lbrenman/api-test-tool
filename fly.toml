# fly launch --no-deploy --copy-config --name <your-app>
# fly volumes create att_data --size 1 --region <region>
# fly secrets set ADMIN_PASSWORD=...
# fly deploy
app = "api-test-tool"
primary_region = "ewr"

# Run exactly ONE machine. Volumes are not replicated, and MCP sessions, A2A
# tasks, SSE/WebSocket change feeds and the Inspector live stream are held in
# one process. Ignore Fly's "add a second machine" advice for this app.

# Swap on the root filesystem: absorbs memory spikes (sample-file generation,
# large uploads, Newman runs) instead of an out-of-memory kill.
swap_size_mb = 512

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  DB_DRIVER = "sqlite"
  SQLITE_PATH = "/data/app.db"
  FILE_STORE = "local"
  FILE_DIR = "/data/files"
  SEED_ON_START = "if-empty"
  # Keep at about 75% of the VM memory below (512 MB -> 384), so Node collects
  # garbage before the kernel starts swapping. Change both together.
  NODE_OPTIONS = "--max-old-space-size=384"
  # PUBLIC_BASE_URL is auto-detected from FLY_APP_NAME (https://<app>.fly.dev)

[[mounts]]
  source = "att_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  # Always on: no cold start after idle, and MCP sessions, A2A tasks and open
  # streams survive quiet periods. The machine is billed all the time; for
  # stop-when-idle use auto_stop_machines = "stop" and min_machines_running = 0.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  # Long-lived connections (Inspector live stream, /sse, /ws, MCP and A2A
  # streams, GraphQL subscriptions) count against this limit. Fly's defaults
  # (20 soft / 25 hard) are easy to hit, and the proxy then queues requests.
  [http_service.concurrency]
    type = "connections"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
