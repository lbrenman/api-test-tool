# fly launch --no-deploy --copy-config --name <your-app>
# fly volumes create att_data --size 1 --region <region>
# fly secrets set ADMIN_PASSWORD=...
# fly deploy
app = "api-test-tool"
primary_region = "bos"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  DB_DRIVER = "sqlite"
  SQLITE_PATH = "/data/app.db"
  FILE_STORE = "local"
  FILE_DIR = "/data/files"
  SEED_ON_START = "if-empty"
  # PUBLIC_BASE_URL is auto-detected from FLY_APP_NAME (https://<app>.fly.dev)

[[mounts]]
  source = "att_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
